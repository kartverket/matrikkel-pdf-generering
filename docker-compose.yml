services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - docker/local-compose.env
    environment:
      - GOTENBERG_URL=http://gotenberg:8089
    ports:
      - "8086:8086"
    depends_on:
      - gotenberg
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-port=8089"]
    ports:
      - "8089:8089"
    restart: unless-stopped
